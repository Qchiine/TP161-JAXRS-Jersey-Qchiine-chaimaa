# ============================================================================
# Microservice bancaire - TP 7 JAX-RS / Jersey
# ----------------------------------------------------------------------------
# Base H2 en memoire nommee "banque", console web activee pour inspection.
# Le service ecoute sur le port 8082, comme demande par l'enonce.
# ============================================================================

server.port=8082

spring.datasource.url=jdbc:h2:mem:banque;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2 accessible sur http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jersey : les ressources JAX-RS sont declarees dans la classe de configuration
spring.jersey.application-path=/
logging.level.root=WARN
logging.level.ma.fstg.banque=INFO
